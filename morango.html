<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lactogal - Preparação Lote Morango</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>try{var t=localStorage.getItem('lactogal_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/pages/morango.js"></script>
</head>
<body>

    <aside class="sidebar" data-nav></aside>

    <main class="main-content">
        <header class="header">
            <h1>Preparação Lote Morango</h1>
            <a href="index.html" class="back-btn">← Voltar ao Início</a>
        </header>

        <!-- Card de Upload: dados da tabela carregados a partir de CSV -->
        <div class="card no-print">
            <h2 class="card-title">
                Carregar Dados do Excel
                <label for="csvFileInput" class="upload-btn">📂 Selecionar Ficheiro CSV</label>
                <input type="file" id="csvFileInput" accept=".csv" style="display: none;">
            </h2>
            <div class="status-msg" id="fileStatus">A carregar dados...</div>
        </div>

        <div class="card">
            <h2 class="card-title">Nova Formulação</h2>
            <div class="input-row">
                <div class="input-group">
                    <label for="contentorInput">Quant. Contentor de Polpa:</label>
                    <input type="number" id="contentorInput" min="0" step="0.001">
                </div>
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">Quantidades do Lote</h2>
            <div class="table-scroll">
            <table class="result-table">
                <thead>
                    <tr>
                        <th>Ingrediente</th>
                        <th>Quantidade</th>
                    </tr>
                </thead>
                <tbody id="morangoTable"></tbody>
            </table>
            </div>
            <div class="metadata mt">RJ Software Março 2011</div>
        </div>
    </main>
</body>
</html>
