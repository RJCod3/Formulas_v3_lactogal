<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lactogal - Tabela de Densidades</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>try{var t=localStorage.getItem('lactogal_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/pages/densidades.js"></script>
</head>
<body>
    <aside class="sidebar" data-nav></aside>

    <main class="main-content">
        <header class="header">
            <h1>Tabela de Densidades</h1>
            <a href="index.html" class="back-btn">← Voltar ao Início</a>
        </header>

        <!-- Card de Upload -->
        <div class="card">
            <h2 class="card-title">
                Carregar Dados do Excel
                <label for="csvFileInput" class="upload-btn">📂 Selecionar Ficheiro CSV</label>
                <input type="file" id="csvFileInput" accept=".csv" style="display: none;">
            </h2>
            <div class="status-msg" id="fileStatus">A carregar dados...</div>
        </div>

        <!-- Badges de Informação -->
        <div class="info-badges">
            <div class="badge">Gerber: <input type="number" id="gerberInput" value="0.2" step="0.01"></div>
            <div class="badge">Atualizado: <strong>25/09/2026</strong></div>
        </div>

        <!-- Tabela -->
        <div class="card">
            <div class="search-bar">
                <span class="icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Pesquisar por código ou descrição...">
            </div>
            <div class="table-scroll">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 120px;">Código</th>
                            <th>Descrição</th>
                            <th style="width: 120px;">Densidade</th>
                            <th style="width: 120px;">G% m/m</th>
                        </tr>
                    </thead>
                    <tbody id="densidadesTable"></tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
